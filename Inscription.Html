    <header>
    <nav>
        <ul class="navi">
            <li><a href="index.html">Acceuil</a></li>

            <li><a href="compte.html">Compte</a></li>
            <li><a href="jeu.html">Jeu</a></li>
            </ul>
            </nav>
   </header>
   <main>
    <div class="cmain">
        <h1>Inscription</h1>
        <p>Veuillez remplir le formulaire ci-dessous pour vous inscrire :</p>

        <form id="registrationForm" method="post" >
            <label for="username">Nom d'utilisateur :</label>
            <input type="text" id="username" name="username" minlength="3" required>
            <br>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" 
             pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Veuillez entrer une adresse e-mail valide avec une extension (ex: nom@domaine.fr)"
 pattern=".+@campus-eni\.fr"  required />   
            <br>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password"  minlength="6" required pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{6,}" >
            <br>
     <label for="confirmpassword">Confirmer le mot de passe :</label>   
     <input type="password" id="cpassword" name="confirm password" minlength="6" required  pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{6,}">
            <button type="submit">S'inscrire</button>

            
        <a href="Compte.Html"><button type="button"> vous connecter</button></a>
        </form>
    </div>
 </main>
</body>
</html>
